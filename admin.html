<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crear invitación · María Luciana</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.admin-page{min-height:100vh;background:linear-gradient(180deg,#061733,#0a2a57);color:#fff;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif}
    .admin-card{width:min(620px,100%);background:rgba(10,32,67,.94);border:1px solid rgba(244,198,90,.45);border-radius:28px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .admin-card h1{font-family:Georgia,serif;font-size:clamp(30px,6vw,48px);margin:6px 0 8px}.admin-card .gold{color:#f4c65a;letter-spacing:.18em;text-transform:uppercase;font-size:12px}
    .admin-field{display:grid;gap:8px;margin:20px 0}.admin-field label{color:#d9e8ff}.admin-field input{width:100%;box-sizing:border-box;padding:15px 16px;border-radius:16px;border:1px solid #36547d;background:#06152e;color:#fff;font-size:17px}
    .passes-control{display:grid;grid-template-columns:56px 1fr 56px;gap:10px}.passes-control button{border:0;border-radius:15px;font-size:26px;cursor:pointer}.passes-control input{text-align:center;font-weight:700}
    .admin-action{width:100%;padding:16px;border:0;border-radius:999px;background:linear-gradient(90deg,#dbeeff,#83c2ff);color:#092752;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}
    .result{display:none;margin-top:24px;padding:20px;border:1px solid rgba(244,198,90,.4);border-radius:20px;background:rgba(255,255,255,.05)}.result.show{display:block}.result strong{color:#f4c65a;font-family:Georgia,serif;font-size:26px}.result-actions{display:grid;gap:10px;margin-top:16px}.secondary{background:#fff;color:#092752}.hint{font-size:13px;color:#a9bdd8;line-height:1.5}.url-preview{font-size:12px;word-break:break-all;color:#9fb9dc;margin-top:12px}
  </style>
</head>
<body class="admin-page">
  <main class="admin-card">
    <div class="gold">Panel privado</div>
        <img
  src="./img/img12.png"
  alt="Mis XV años de María Luciana"
  class="admin-logo"
/>
    <h1>Crear invitación</h1>
    <p class="hint">Escribe la familia y sus pases. No se guarda ninguna lista: cada vez puedes crear una invitación diferente.</p>
    <div class="admin-field"><label for="family">Familia o invitado</label><input id="family" placeholder="Ej. Familia González" autocomplete="off"></div>
    <div class="admin-field"><label>Número de Pases Reales</label><div class="passes-control"><button id="minus" type="button">−</button><input id="passes" type="number" min="1" max="20" value="2"><button id="plus" type="button">+</button></div></div>
    <div class="admin-field"><label for="whatsapp">WhatsApp que recibirá las confirmaciones</label><input id="whatsapp" inputmode="tel" placeholder="Ej. 529991234567"><span class="hint">Incluye código de país. Este número se recuerda únicamente en este dispositivo.</span></div>
    <button class="admin-action" id="generate" type="button">✨ Crear invitación</button>
    <section class="result" id="result">
      <div class="gold">Invitación lista</div><p><strong id="resultFamily"></strong></p><p id="resultPasses"></p>
      <div class="result-actions"><button class="admin-action" id="preview" type="button">👁️ Ver invitación</button><button class="admin-action secondary" id="share" type="button">Enviar por WhatsApp</button><button class="admin-action secondary" id="copy" type="button">📋 Copiar enlace</button></div>
      <div class="url-preview" id="urlPreview"></div>
    </section>
  </main>
<script>
  const family=document.getElementById('family'), passes=document.getElementById('passes'), wa=document.getElementById('whatsapp'); let inviteUrl='';
  wa.value=localStorage.getItem('xvConfirmWhatsapp')||'';
  const clamp=()=>passes.value=Math.min(20,Math.max(1,parseInt(passes.value||1,10)));
  document.getElementById('minus').onclick=()=>{passes.value=+passes.value-1;clamp()}; document.getElementById('plus').onclick=()=>{passes.value=+passes.value+1;clamp()}; passes.onchange=clamp;
  document.getElementById('generate').onclick=()=>{const f=family.value.trim(), w=wa.value.replace(/\D/g,'');clamp(); if(!f){alert('Escribe el nombre de la familia o invitado.');family.focus();return} if(w.length<10){alert('Escribe el WhatsApp que recibirá las confirmaciones, con código de país.');wa.focus();return} localStorage.setItem('xvConfirmWhatsapp',w); const u=new URL('./',location.href); u.searchParams.set('familia',f);u.searchParams.set('pases',passes.value);u.searchParams.set('wa',w);inviteUrl=u.href;document.getElementById('resultFamily').textContent=f;document.getElementById('resultPasses').textContent=`${passes.value} ${+passes.value===1?'Pase Real':'Pases Reales'}`;document.getElementById('urlPreview').textContent=inviteUrl;document.getElementById('result').classList.add('show')};
  document.getElementById('preview').onclick=()=>inviteUrl&&window.open(inviteUrl,'_blank','noopener');
  document.getElementById('copy').onclick=async()=>{if(!inviteUrl)return;await navigator.clipboard.writeText(inviteUrl);document.getElementById('copy').textContent='✓ Enlace copiado';setTimeout(()=>document.getElementById('copy').textContent='📋 Copiar enlace',1800)};
 document.getElementById('share').onclick=()=>{
  if(!inviteUrl)return;

  const text=`✨ Tienes una invitación especial para los XV de María Luciana.

💙 Toca la invitación para abrirla:
${inviteUrl}`;

  window.open(
    `https://wa.me/?text=${encodeURIComponent(text)}`,
    '_blank',
    'noopener'
  );
};
</script>
</body></html>
